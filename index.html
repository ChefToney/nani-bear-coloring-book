<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 22px 12px 30px;
  background: radial-gradient(circle at top left,#ffe0f3 0,#fff4fb 42%,#f0e6ff 100%);
  font-family: Arial, sans-serif; text-align: center; color: #703b83;
}
body::before, body::after { content:""; position:fixed; inset:-18%; pointer-events:none; z-index:-1; }
body::before { background: radial-gradient(circle at 15% 25%,#ffb7df70 0 5%,transparent 18%), radial-gradient(circle at 82% 18%,#c9a4ff70 0 6%,transparent 20%), radial-gradient(circle at 72% 78%,#9cecff55 0 5%,transparent 18%), radial-gradient(circle at 22% 82%,#ffe68b66 0 4%,transparent 17%); filter:blur(10px); animation: dreamyDrift 18s ease-in-out infinite alternate; }
body::after { inset:0; opacity:.32; background-image: radial-gradient(circle,#fff 1.5px,transparent 2px),radial-gradient(circle,#d98be8 1px,transparent 2px); background-size:97px 113px,143px 157px; background-position:0 0,45px 62px; animation: twinkleBackdrop 7s ease-in-out infinite alternate; }
@keyframes dreamyDrift { from { transform:translate3d(-2%, -1%, 0) scale(1); } to { transform:translate3d(2%, 1.5%, 0) scale(1.08); } }
@keyframes twinkleBackdrop { from { opacity:.16; } to { opacity:.42; } }
@media(prefers-reduced-motion:reduce) { body::before,body::after { animation:none; } }
.hero {
  max-width: 1100px; margin: 0 auto 18px; padding: 24px 16px 20px;
  border: 1px solid #f4c8e8; border-radius: 26px;
  background: linear-gradient(135deg,#fff 0%,#fff0fa 52%,#f1e6ff 100%);
  box-shadow: 0 10px 30px #9d58a51c;
}
h1 { margin: 0 0 11px; font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif; font-weight: 900; font-size: clamp(30px,6vw,50px); letter-spacing: .4px; line-height: 1.12; background: linear-gradient(100deg,#ff4fa3 0%,#b34de2 38%,#7a63df 68%,#ff70b8 100%); background-size: 220% auto; background-clip: text; -webkit-background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 3px 0 #fff) drop-shadow(0 5px 7px #a34eb855); animation: titleShimmer 5s ease-in-out infinite; }
@keyframes titleShimmer { 0%,100% { background-position: 0% center; } 50% { background-position: 100% center; } }
@media(prefers-reduced-motion:reduce) { h1 { animation:none; } }
.tagline { margin: 0 auto 13px; max-width: 620px; color: #704b7e; line-height: 1.5; }
.pills { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; }
.pills span { background:#fff; border:1px solid #f0cce9; border-radius:999px; padding:7px 12px; font-size:12px; color:#914aa5; font-weight:bold; }
jl-coloringbook {
  display: block; max-width: 1100px; margin: 18px auto;
  background: rgba(255,255,255,.82); padding: 12px;
  border: 1px solid #f2cdea; border-radius: 24px;
  box-shadow: 0 12px 34px #8d4e9a20;
}
.footer { color:#8a6592; font-size:13px; margin:18px auto 0; }
</style>
</head>
